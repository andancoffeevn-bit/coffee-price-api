name: Update Coffee Price
on:
  workflow_dispatch: # Cho phép nhấn nút chạy tay ở tab Actions
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write # Cấp quyền ghi

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Dòng này cực kỳ quan trọng
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run script
        run: python get_price.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Kiểm tra xem có file nào thay đổi không trước khi commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update coffee price" && git push)
