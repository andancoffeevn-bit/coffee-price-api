name: Update Coffee Price
on:
  push:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run script
        run: |
          # Kiểm tra file đã có chưa
          python get_price.py
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          # Dùng -f (force) để ép buộc lưu file dù có lỗi gì đi nữa
          git commit -m "Update coffee price" || echo "Không có thay đổi"
          git push
